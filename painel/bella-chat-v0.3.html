<title>Bella — Prisbel Construtora (v0.3 — ao vivo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --brand:#22219B; --brand-deep:#16166B; --brand-soft:#E4E4F7;
    --amber:#E8A33D; --amber-deep:#B87A1E;
    --bg:#F6F6FB; --panel:#FFFFFF; --ink:#1C1D33; --ink-2:#5A5B78; --line:#DDDDEC;
    --bubble-user:#22219B; --bubble-user-ink:#FFFFFF;
    --bubble-bella:#FFFFFF; --ok:#2E7D5B; --warn:#B4552D;
    --shadow:0 1px 3px rgba(28,29,51,.08),0 8px 24px rgba(28,29,51,.06);
  }
  @media (prefers-color-scheme: dark){:root{
    --brand:#8D8DE8; --brand-deep:#B9B9F2; --brand-soft:#232457;
    --bg:#13142A; --panel:#1C1D3B; --ink:#EAEAF6; --ink-2:#9C9DBF; --line:#2E2F55;
    --bubble-user:#3B3BC0; --bubble-user-ink:#FFFFFF; --bubble-bella:#1C1D3B;
    --ok:#5BBd93; --warn:#E08D63;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }}
  :root[data-theme="dark"]{
    --brand:#8D8DE8; --brand-deep:#B9B9F2; --brand-soft:#232457;
    --bg:#13142A; --panel:#1C1D3B; --ink:#EAEAF6; --ink-2:#9C9DBF; --line:#2E2F55;
    --bubble-user:#3B3BC0; --bubble-user-ink:#FFFFFF; --bubble-bella:#1C1D3B;
    --ok:#5BBD93; --warn:#E08D63;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  :root[data-theme="light"]{
    --brand:#22219B; --brand-deep:#16166B; --brand-soft:#E4E4F7;
    --bg:#F6F6FB; --panel:#FFFFFF; --ink:#1C1D33; --ink-2:#5A5B78; --line:#DDDDEC;
    --bubble-user:#22219B; --bubble-user-ink:#FFFFFF; --bubble-bella:#FFFFFF;
    --ok:#2E7D5B; --warn:#B4552D;
    --shadow:0 1px 3px rgba(28,29,51,.08),0 8px 24px rgba(28,29,51,.06);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; height:100dvh; overflow:hidden; font-size:16px; line-height:1.45;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

  /* ---------- sidebar ---------- */
  aside{
    width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 14px;gap:18px;
  }
  .logo{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .logo svg{flex-shrink:0}
  .logo b{font-size:1.25rem;font-weight:700;letter-spacing:.01em}
  .logo small{display:block;font-size:.7rem;color:var(--ink-2);font-weight:400;margin-top:-2px}
  .side-sec{display:flex;flex-direction:column;gap:6px}
  .conv{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:10px;text-align:left}
  .conv:hover{background:var(--brand-soft)}
  .conv .t{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .s{font-size:.78rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pend{
    border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;
    padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left
  }
  .pend b{font-size:.85rem}
  .pend span{font-size:.78rem;color:var(--ink-2)}
  .user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line)}
  .user .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .user b{font-size:.9rem;display:block}
  .user span{font-size:.75rem;color:var(--ink-2)}

  /* ---------- main ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{
    display:flex;align-items:center;gap:12px;padding:12px 20px;
    background:var(--panel);border-bottom:1px solid var(--line)
  }
  #menu-btn{display:none;font-size:1.3rem;padding:4px 8px}
  .obra{
    display:flex;align-items:center;gap:8px;background:var(--brand-soft);
    border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem
  }
  .obra select{border:none;background:transparent;font:inherit;font-weight:600;color:inherit;cursor:pointer}
  .obra select:focus-visible{outline:2px solid var(--brand)}
  header .sino{margin-left:auto;position:relative;font-size:1.15rem;padding:6px}
  .sino i{
    position:absolute;top:2px;right:0;background:var(--warn);color:#fff;border-radius:999px;
    font-style:normal;font-size:.62rem;font-weight:700;padding:1px 5px
  }

  #chat{flex:1;overflow-y:auto;padding:26px 20px 10px;scroll-behavior:smooth}
  .chat-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  /* saudação */
  #hello{max-width:720px;margin:0 auto;padding:6vh 4px 0;display:flex;flex-direction:column;gap:22px}
  #hello h1{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:650;text-wrap:balance;line-height:1.25}
  #hello h1 em{font-style:normal;color:var(--brand)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{
    display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:13px 17px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow)
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* mensagens */
  .msg{display:flex;gap:10px;max-width:86%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .b-av{width:32px;height:32px;flex-shrink:0;border-radius:10px;background:var(--brand);display:grid;place-items:center;margin-top:2px}
  .bubble{padding:11px 15px;border-radius:16px;box-shadow:var(--shadow);font-size:.95rem}
  .msg.user .bubble{background:var(--bubble-user);color:var(--bubble-user-ink);border-bottom-right-radius:5px}
  .msg.bella .bubble{background:var(--bubble-bella);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble ul{padding-left:18px;margin:6px 0 2px}
  .bubble .tag{
    display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;border-radius:6px;
    padding:2px 8px;margin-top:8px
  }
  .tag.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
  .tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
  .typing{display:inline-flex;gap:4px;padding:6px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:tp 1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){.typing i{animation:none}}

  /* composer */
  .composer{padding:10px 20px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
  .composer-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .quick .chip{padding:8px 13px;font-size:.83rem;border-radius:999px;flex-shrink:0;box-shadow:none}
  .box{
    display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1.5px solid var(--line);
    border-radius:22px;padding:8px 8px 8px 18px;box-shadow:var(--shadow)
  }
  .box:focus-within{border-color:var(--brand)}
  .box textarea{
    flex:1;border:none;background:transparent;font:inherit;color:inherit;resize:none;
    max-height:110px;padding:8px 0;outline:none
  }
  .mic,.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
  .mic{background:var(--amber);color:#fff;font-size:1.25rem}
  .mic.rec{animation:pulse 1.1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--amber) 25%,transparent)}}
  .send{background:var(--brand);color:#fff;font-size:1.1rem}
  .send:disabled{opacity:.35;cursor:default}
  .foot{font-size:.72rem;color:var(--ink-2);text-align:center}

  /* ---------- mobile ---------- */
  #overlay{display:none}
  @media (max-width:840px){
    aside{position:fixed;inset:0 30% 0 0;z-index:30;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
    @media (prefers-reduced-motion: reduce){aside{transition:none}}
    aside.open{transform:none}
    #overlay.show{display:block;position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:20}
    #menu-btn{display:block}
    .msg{max-width:94%}
  }
</style>

<aside id="side">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <rect width="34" height="34" rx="8" fill="#22219B"/>
      <path d="M10 8l7 4v6l-7-4V8zm14 3l-7 4v6l7-4v-6zM10 19l7 4v6l-7-4v-6z" fill="#fff"/>
      <circle cx="26.5" cy="8.5" r="3.2" fill="#E8A33D"/>
    </svg>
    <div><b>Bella</b><small>Compras · Prisbel Construtora</small></div>
  </div>

  <div class="side-sec">
    <span class="eyebrow">Pendências</span>
    <button class="pend" data-flow="pendencia">
      <b>Pedido 14 · luvas de vaqueta</b>
      <span>Falta o tamanho — toque para responder</span>
    </button>
  </div>

  <div class="side-sec">
    <span class="eyebrow">Conversas</span>
    <button class="conv"><span class="t">Pedido 14 — EPI Paradiso</span><span class="s">hoje · 1 pendência</span></button>
    <button class="conv"><span class="t">Status do pedido 11</span><span class="s">ontem · concluído</span></button>
    <button class="conv"><span class="t">Cimento CP II — 50 sacos</span><span class="s">seg · AF emitida</span></button>
  </div>

  <div class="user">
    <div class="av">DA</div>
    <div><b>Daniela</b><span>Compradora</span></div>
  </div>
</aside>
<div id="overlay"></div>

<main>
  <header>
    <button id="menu-btn" aria-label="Abrir menu">☰</button>
    <div class="obra"><span aria-hidden="true">📍</span>
      <label class="eyebrow" for="obra" style="letter-spacing:.08em">Obra</label>
      <select id="obra">
        <option>Paradiso</option><option>Vinhático</option><option>ARBO</option>
      </select>
    </div>
    <button class="sino" aria-label="1 pendência"><span aria-hidden="true">🔔</span><i>1</i></button>
  </header>

  <div id="chat">
    <div id="hello">
      <h1>Oi, Daniela! Sou a <em>Bella</em>.<br>O que a obra precisa hoje?</h1>
      <div class="chips">
        <button class="chip" data-flow="pedido"><span aria-hidden="true">🧱</span> Novo pedido</button>
        <button class="chip" data-flow="status"><span aria-hidden="true">📋</span> Status do meu pedido</button>
        <button class="chip" data-flow="duvida"><span aria-hidden="true">❓</span> Dúvida de material</button>
      </div>
    </div>
    <div class="chat-inner" id="thread"></div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <div class="quick" id="quick" hidden></div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Fale com a Bella…" aria-label="Mensagem para a Bella"></textarea>
        <button class="mic" id="mic" aria-label="Falar com a Bella"><span aria-hidden="true">🎤</span></button>
        <button class="send" id="send" aria-label="Enviar" disabled>➤</button>
      </div>
      <p class="foot">Bella v0.3 — fale ou escreva; áudio transcrito pela IA (piloto).</p>
    </div>
  </div>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const thread = $('#thread'), chat = $('#chat'), hello = $('#hello');
  const input = $('#input'), send = $('#send'), mic = $('#mic'), quick = $('#quick');

  const TOKEN = new URLSearchParams(location.search).get('t') || '';
  const API_URL = '/webhook/bella-chat-api';
  const historico = []; // {de:'usuario'|'bella', texto}

  const AV = '<div class="b-av" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 34 34"><path d="M10 8l7 4v6l-7-4V8zm14 3l-7 4v6l7-4v-6zM10 19l7 4v6l-7-4v-6z" fill="#fff"/></svg></div>';
  function push(who, html){
    const m = document.createElement('div');
    m.className = 'msg ' + who;
    m.innerHTML = (who === 'bella' ? AV : '') + '<div class="bubble">' + html + '</div>';
    thread.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
    return m;
  }
  function typing(){ return push('bella', '<span class="typing"><i></i><i></i><i></i></span>'); }
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function render(texto){
    return esc(texto)
      .replace(/&lt;(\/?)(b|i|ul|li|br)&gt;/g, '<$1$2>')
      .replace(/\n/g, '<br>');
  }
  function start(){ hello.style.display = 'none'; }

  let ocupado = false;
  async function chamarAPI(body, bolhaUser, textoUser){
    const t = typing();
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          t: TOKEN, obra: $('#obra').value, historico: historico.slice(-12),
        }, body)),
      });
      const data = await res.json();
      // áudio: troca a bolha do usuário pela transcrição
      if (data.transcricao && bolhaUser) {
        bolhaUser.querySelector('.bubble').innerHTML = '🎤 ' + esc(data.transcricao);
        historico.push({ de: 'usuario', texto: data.transcricao });
      } else if (textoUser) {
        historico.push({ de: 'usuario', texto: textoUser });
      }
      const resposta = data.resposta || 'Opa, me perdi aqui. Pode repetir?';
      t.querySelector('.bubble').innerHTML = render(resposta);
      historico.push({ de: 'bella', texto: resposta });
    } catch (e) {
      t.querySelector('.bubble').innerHTML =
        'Tive um problema de conexão agora. 😅 Tenta de novo em instantes, por favor.';
    }
    chat.scrollTop = chat.scrollHeight;
    ocupado = false;
  }
  async function enviar(texto){
    if (ocupado || !texto.trim()) return;
    ocupado = true; quick.hidden = true; start();
    push('user', esc(texto));
    await chamarAPI({ mensagem: texto }, null, texto);
  }

  const STARTERS = {
    pedido: 'Manda 50 sacos de cimento e um rolo de lona preta',
    status: 'Como estão os pedidos? Tem alguma pendência?',
    duvida: 'Preciso de 50 conjuntos de vaso sanitário. O que eu preciso especificar?',
    pendencia: 'Quais pedidos estão com pendência? Me ajuda a resolver.',
  };
  document.querySelectorAll('[data-flow]').forEach((b) =>
    b.addEventListener('click', () => {
      document.getElementById('side').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
      enviar(STARTERS[b.dataset.flow] || b.textContent.trim());
    }));

  input.addEventListener('input', () => {
    send.disabled = !input.value.trim();
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });
  function sendFree(){
    const v = input.value.trim(); if (!v) return;
    input.value = ''; send.disabled = true; input.style.height = 'auto';
    enviar(v);
  }
  send.addEventListener('click', sendFree);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendFree(); } });

  /* ------- microfone: grava e o Gemini transcreve (estilo WhatsApp) ------- */
  let rec = null, chunks = [];
  mic.addEventListener('click', async () => {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    if (ocupado) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
        .find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = [];
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach((tr) => tr.stop());
        mic.classList.remove('rec'); mic.textContent = '🎤';
        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        if (blob.size < 2000) return; // toque acidental
        ocupado = true; quick.hidden = true; start();
        const bolha = push('user', '🎤 <i>enviando áudio…</i>');
        const b64 = await new Promise((ok) => {
          const fr = new FileReader();
          fr.onload = () => ok(String(fr.result).split(',')[1]);
          fr.readAsDataURL(blob);
        });
        await chamarAPI({ audio: { mime: blob.type.split(';')[0], data: b64 } }, bolha, null);
      };
      rec.start();
      mic.classList.add('rec'); mic.textContent = '⏹';
    } catch (e) {
      push('bella', 'Não consegui acessar o microfone. Verifique a permissão do navegador (ícone de cadeado na barra de endereço) e tente de novo. 🙏');
    }
  });

  const side = $('#side'), overlay = $('#overlay');
  $('#menu-btn').addEventListener('click', () => { side.classList.add('open'); overlay.classList.add('show'); });
  overlay.addEventListener('click', () => { side.classList.remove('open'); overlay.classList.remove('show'); });
  document.querySelectorAll('aside .conv').forEach((b) => b.addEventListener('click', () => { side.classList.remove('open'); overlay.classList.remove('show'); }));
</script>
